version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - exhaustive
    - godot
    - gomoddirectives
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - rowserrcheck
    - sqlclosecheck
    - tparallel
    - unconvert
    - unparam
    - whitespace
    # - wrapcheck
  exclusions:
    generated: lax
    presets:
      - common-false-positives
    rules:
      # httptest.NewRequest without a context is idiomatic in tests, gosec
      # targets production code, preallocation hints are noise in test helpers,
      # and bodyclose cannot see bodies closed inside shared test helpers.
      - path: _test\.go
        linters:
          - noctx
          - gosec
          - prealloc
          - bodyclose
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
